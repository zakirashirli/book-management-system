<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | BookSys</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<h1>BookSys</h1>
<p class="site-subtitle">Set a new password</p>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon amber"><i class="ti ti-lock-check"></i></div>
            <h2>Reset password</h2>
        </div>

        <div class="field">
            <label>Email</label>
            <input id="resetEmail" type="email" placeholder="john@example.com">
        </div>

        <div class="field">
            <label>OTP code</label>
            <input id="resetCode" type="text" placeholder="6-digit code" maxlength="6">
        </div>

        <div class="field">
            <label>New password</label>
            <input id="newPassword" type="password" placeholder="newPassword123">
        </div>

        <button class="amber" onclick="resetPassword()">
            <i class="ti ti-device-floppy"></i> Change password
        </button>

        <p class="message" id="resetMessage"></p>

        <div class="links">
            <a href="login.html">Back to Login</a>
            <a href="index.html">← Home</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
