<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | BookSys</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<h1>BookSys</h1>
<p class="site-subtitle">Login to your account</p>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon purple"><i class="ti ti-lock"></i></div>
            <h2>Login</h2>
        </div>

        <div class="field">
            <label>Username</label>
            <input id="username" type="text" placeholder="john_doe">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <button class="purple" onclick="login()">
            <i class="ti ti-login"></i> Sign in
        </button>

        <p class="message" id="loginMessage"></p>

        <div class="links">
            <a href="register.html">Create account</a>
            <a href="forgot-password.html">Forgot password?</a>
            <a href="index.html">← Home</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
