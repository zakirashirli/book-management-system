<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BookSys</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<h1>BookSys</h1>
<p class="site-subtitle">Manage your library with ease</p>

<div class="container">

  <!-- Register -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon blue"><i class="ti ti-user-plus"></i></div>
      <h2>Register</h2>
    </div>

    <div class="field">
      <label>Username</label>
      <input id="registerUsername" type="text" placeholder="john_doe">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="john@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="registerPassword" type="password" placeholder="••••••••">
    </div>

    <button class="blue" onclick="registerUser()">
      <i class="ti ti-user-check"></i> Create account
    </button>

    <p class="message" id="registerMessage"></p>
  </div>

  <!-- Verify -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon teal"><i class="ti ti-mail-check"></i></div>
      <h2>Verify email</h2>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="verifyEmail" type="email" placeholder="john@example.com">
    </div>

    <div class="field">
      <label>OTP code</label>
      <input id="verifyCode" type="text" placeholder="6-digit code" maxlength="6">
    </div>

    <button class="teal" onclick="verifyOtp()">
      <i class="ti ti-shield-check"></i> Verify
    </button>

    <p class="message" id="verifyMessage"></p>
  </div>

  <!-- Login -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon purple"><i class="ti ti-lock"></i></div>
      <h2>Login</h2>
    </div>

    <div class="field">
      <label>Username</label>
      <input id="username" type="text" placeholder="john_doe">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••">
    </div>

    <button class="purple" onclick="login()">
      <i class="ti ti-login"></i> Sign in
    </button>

    <p class="message" id="loginMessage"></p>
  </div>

  <!-- Token Actions -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon blue"><i class="ti ti-refresh"></i></div>
      <h2>Session</h2>
    </div>

    <button class="blue" onclick="refreshAccessToken()">
      <i class="ti ti-refresh"></i> Refresh token
    </button>

    <button class="purple" onclick="logoutUser()">
      <i class="ti ti-logout"></i> Logout
    </button>

    <p class="message" id="refreshMessage"></p>
    <p class="message" id="logoutMessage"></p>
  </div>

  <!-- Forgot Password -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon teal"><i class="ti ti-key"></i></div>
      <h2>Forgot password</h2>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="forgotEmail" type="email" placeholder="john@example.com">
    </div>

    <button class="teal" onclick="forgotPassword()">
      <i class="ti ti-mail-forward"></i> Send OTP
    </button>

    <p class="message" id="forgotMessage"></p>
  </div>

  <!-- Reset Password -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon amber"><i class="ti ti-lock-check"></i></div>
      <h2>Reset password</h2>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="resetEmail" type="email" placeholder="john@example.com">
    </div>

    <div class="field">
      <label>OTP code</label>
      <input id="resetCode" type="text" placeholder="6-digit code" maxlength="6">
    </div>

    <div class="field">
      <label>New password</label>
      <input id="newPassword" type="password" placeholder="newPassword123">
    </div>

    <button class="amber" onclick="resetPassword()">
      <i class="ti ti-device-floppy"></i> Change password
    </button>

    <p class="message" id="resetMessage"></p>
  </div>

  <!-- Create Book -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon amber"><i class="ti ti-book-2"></i></div>
      <h2>Add book</h2>
    </div>

    <div class="field">
      <label>Title</label>
      <input id="createTitle" type="text" placeholder="e.g. 1984">
    </div>

    <div class="field">
      <label>Author</label>
      <input id="createAuthor" type="text" placeholder="e.g. George Orwell">
    </div>

    <div class="field">
      <label>Price</label>
      <input id="createPrice" type="number" placeholder="9.99" step="0.01">
    </div>

    <button class="amber" onclick="createBook()">
      <i class="ti ti-plus"></i> Create book
    </button>

    <p class="message" id="createMessage"></p>
  </div>

  <!-- Update Book -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon purple"><i class="ti ti-edit"></i></div>
      <h2>Update book</h2>
    </div>

    <div class="field">
      <label>Book ID</label>
      <input id="updateId" type="number" placeholder="Book ID">
    </div>

    <div class="field">
      <label>Title</label>
      <input id="updateTitle" type="text" placeholder="New title">
    </div>

    <div class="field">
      <label>Author</label>
      <input id="updateAuthor" type="text" placeholder="New author">
    </div>

    <div class="field">
      <label>Price</label>
      <input id="updatePrice" type="number" placeholder="New price" step="0.01">
    </div>

    <button class="purple" onclick="updateBook()">
      <i class="ti ti-device-floppy"></i> Save changes
    </button>

    <p class="message" id="updateMessage"></p>
  </div>

  <!-- Delete Book -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon amber"><i class="ti ti-trash"></i></div>
      <h2>Delete book</h2>
    </div>

    <div class="field">
      <label>Book ID</label>
      <input id="deleteId" type="number" placeholder="Book ID">
    </div>

    <button class="amber" onclick="deleteBook()">
      <i class="ti ti-trash-x"></i> Delete book
    </button>

    <p class="message" id="deleteMessage"></p>
  </div>

</div>

<!-- Books Section -->
<div class="container second-container">

  <!-- All Books -->
  <div class="card full-width">
    <div class="card-header">
      <div class="card-icon blue"><i class="ti ti-books"></i></div>
      <h2>All books</h2>
    </div>

    <div class="controls">
      <input id="page" type="number" placeholder="Page" value="0" min="0">
      <input id="size" type="number" placeholder="Size" value="5" min="1">
      <input id="sortBy" type="text" placeholder="Sort by" value="title">

      <select id="direction">
        <option value="asc">ASC</option>
        <option value="desc">DESC</option>
      </select>

      <button class="blue small-btn" onclick="getBooks()">
        <i class="ti ti-refresh"></i> Load books
      </button>
    </div>

    <div id="books"></div>
  </div>

  <!-- Filter Books -->
  <div class="card full-width">
    <div class="card-header">
      <div class="card-icon teal"><i class="ti ti-filter"></i></div>
      <h2>Filter books</h2>
    </div>

    <div class="controls">
      <input id="filterTitle" type="text" placeholder="Title">
      <input id="filterAuthor" type="text" placeholder="Author">
      <input id="filterMinPrice" type="number" placeholder="Min price">
      <input id="filterMaxPrice" type="number" placeholder="Max price">

      <button class="teal small-btn" onclick="filterBooks()">
        <i class="ti ti-search"></i> Filter
      </button>
    </div>

    <div id="filteredBooks" class="books-result"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
