<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | BookSys</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<h1>BookSys</h1>
<p class="site-subtitle">Recover your account password</p>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon teal"><i class="ti ti-key"></i></div>
            <h2>Forgot password</h2>
        </div>

        <div class="field">
            <label>Email</label>
            <input id="forgotEmail" type="email" placeholder="john@example.com">
        </div>

        <button class="teal" onclick="forgotPassword()">
            <i class="ti ti-mail-forward"></i> Send OTP
        </button>

        <p class="message" id="forgotMessage"></p>

        <div class="links">
            <a href="reset-password.html">I already have OTP</a>
            <a href="login.html">Back to Login</a>
            <a href="index.html">← Home</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
