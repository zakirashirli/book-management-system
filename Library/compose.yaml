services:

  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: library_db
      MYSQL_USER: booksys
      MYSQL_PASSWORD: 1234
    volumes:
      - /var/lib/docker/volumes/mysql-data/_data
    networks:
      - library-net
  app:
    build: .
    container_name: library-app-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_db
      SPRING_DATASOURCE_USERNAME: booksys
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - mysql
    networks:
      - library-net
volumes:
  mysql-data:
networks:
  library-net: