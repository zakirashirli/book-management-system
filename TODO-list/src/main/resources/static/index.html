<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Task Management</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-container">

    <div>
      <h1>Task Management</h1>
      <p>Create, organize and monitor your tasks.</p>
    </div>

    <button
            id="openCreateModalButton"
            class="button header-create-button"
            type="button"
    >
      + Create Task
    </button>

  </div>
</header>

<main class="container">

  <section class="statistics-grid">

    <article class="stat-card stat-total">
      <span>Total</span>
      <strong id="totalTaskCount">0</strong>
    </article>

    <article class="stat-card stat-todo">
      <span>To Do</span>
      <strong id="todoTaskCount">0</strong>
    </article>

    <article class="stat-card stat-progress">
      <span>In Progress</span>
      <strong id="progressTaskCount">0</strong>
    </article>

    <article class="stat-card stat-done">
      <span>Done</span>
      <strong id="doneTaskCount">0</strong>
    </article>

    <article class="stat-card stat-overdue">
      <span>Overdue</span>
      <strong id="overdueTaskCount">0</strong>
    </article>

  </section>

  <section class="filter-panel">

    <div class="filter-group search-filter">

      <label for="searchInput">
        Search by title
      </label>

      <div class="search-row">

        <input
                id="searchInput"
                type="text"
                placeholder="Enter task title"
        >

        <button
                id="searchButton"
                class="button button-dark"
                type="button"
        >
          Search
        </button>

      </div>

    </div>

    <div class="filter-group">

      <label for="statusFilter">
        Status
      </label>

      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="TODO">To Do</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="DONE">Done</option>
        <option value="OVERDUE">Overdue</option>
      </select>

    </div>

    <div class="filter-group">

      <label for="priorityFilter">
        Priority
      </label>

      <select id="priorityFilter">
        <option value="">All priorities</option>
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
      </select>

    </div>

    <button
            id="resetFiltersButton"
            class="button button-outline"
            type="button"
    >
      Reset
    </button>

  </section>

  <section
          id="loadingMessage"
          class="state-message"
  >
    Loading tasks...
  </section>

  <section
          id="errorMessage"
          class="state-message state-error hidden"
  ></section>

  <section
          id="emptyState"
          class="empty-state hidden"
  >
    <h2>No tasks found</h2>
    <p>Create a task or change the selected filters.</p>
  </section>

  <section
          id="taskGrid"
          class="task-grid"
  ></section>

</main>

<!-- Create/Edit modal -->

<div
        id="taskModal"
        class="modal hidden"
>
  <div
          id="taskModalOverlay"
          class="modal-overlay"
  ></div>

  <div class="modal-content">

    <div class="modal-header">

      <div>
        <h2 id="taskModalTitle">
          Create Task
        </h2>

        <p>Enter the task information.</p>
      </div>

      <button
              id="closeTaskModalButton"
              class="close-button"
              type="button"
      >
        ×
      </button>

    </div>

    <form id="taskForm">

      <input
              id="taskId"
              type="hidden"
      >

      <div class="form-group">

        <label for="taskTitle">
          Title
        </label>

        <input
                id="taskTitle"
                type="text"
                minlength="2"
                maxlength="100"
                placeholder="Enter task title"
                required
        >

      </div>

      <div class="form-group">

        <label for="taskDescription">
          Description
        </label>

        <textarea
                id="taskDescription"
                rows="5"
                maxlength="500"
                placeholder="Enter task description"
        ></textarea>

      </div>

      <div class="form-group">

        <label for="taskDeadline">
          Deadline
        </label>

        <input
                id="taskDeadline"
                type="datetime-local"
                required
        >

      </div>

      <div class="form-row">

        <div class="form-group">

          <label for="taskStatus">
            Status
          </label>

          <select
                  id="taskStatus"
                  required
          >
            <option value="TODO">To Do</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="DONE">Done</option>
          </select>

        </div>

        <div class="form-group">

          <label for="taskPriority">
            Priority
          </label>

          <select
                  id="taskPriority"
                  required
          >
            <option value="LOW">Low</option>

            <option
                    value="MEDIUM"
                    selected
            >
              Medium
            </option>

            <option value="HIGH">High</option>
          </select>

        </div>

      </div>

      <div
              id="formErrorMessage"
              class="form-error hidden"
      ></div>

      <div class="modal-actions">

        <button
                id="cancelTaskButton"
                class="button button-outline"
                type="button"
        >
          Cancel
        </button>

        <button
                id="saveTaskButton"
                class="button button-primary"
                type="submit"
        >
          Create Task
        </button>

      </div>

    </form>

  </div>
</div>

<!-- Delete modal -->

<div
        id="deleteModal"
        class="modal hidden"
>
  <div
          id="deleteModalOverlay"
          class="modal-overlay"
  ></div>

  <div class="modal-content delete-modal-content">

    <div class="delete-icon">
      !
    </div>

    <h2>Delete this task?</h2>

    <p>This action cannot be undone.</p>

    <div class="modal-actions">

      <button
              id="cancelDeleteButton"
              class="button button-outline"
              type="button"
      >
        Cancel
      </button>

      <button
              id="confirmDeleteButton"
              class="button button-danger"
              type="button"
      >
        Delete
      </button>

    </div>

  </div>
</div>

<div
        id="notification"
        class="notification hidden"
></div>

<script src="app.js"></script>

</body>
</html>
