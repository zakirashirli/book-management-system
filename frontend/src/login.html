<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="view-transition" content="same-origin">
  <title>BookSys — Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

  <h1>BookSys</h1>
  <p class="site-subtitle">Sign in to your account</p>

  <div class="container" style="max-width: 420px;">
    <div class="card">
      <div class="card-header">
        <div class="card-icon purple">
          <i class="ti ti-login"></i>
        </div>
        <h2>Sign In</h2>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="johndoe" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button class="purple" onclick="login()">
        <i class="ti ti-login"></i>
        Sign In
      </button>

      <p id="loginMessage" class="message"></p>

      <div style="display: flex; justify-content: space-between; margin-top: 1rem; font-size: 13px;">
        <a href="forgot-password.html" style="color: #6b7280; text-decoration: none;">Forgot Password?</a>
        <a href="register.html" style="color: #1d4ed8; text-decoration: none; font-weight: 500;">Register</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
